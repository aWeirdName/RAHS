[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rahs-eeg"
version = "0.1.0"
description = "Region-Aware Hierarchical Sub-Feature Alignment for EEG-based visual retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4,<3", "numpy>=1.24,<3", "PyYAML>=6,<7", "einops>=0.8,<1"]

[project.optional-dependencies]
features = ["transformers>=4.44,<5", "Pillow>=10", "safetensors>=0.4"]
preprocess = ["mne>=1.6,<2", "scikit-learn>=1.3,<2", "scipy>=1.10,<2"]

[project.urls]
Repository = "https://github.com/aWeirdName/RAHS"

[tool.setuptools.packages.find]
include = ["rahs*"]
